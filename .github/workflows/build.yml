# Builds skia-bindings (crates.io) for wasm32-unknown-emscripten against rust-skia's Skia with
# skia-emdawnwebgpu.patch: Graphite on Dawn's emdawnwebgpu port, plus Ganesh/WebGL 2. Publishes the result as release
# <crate version>-<commit> with asset skia-binaries.tar.gz, in skia-bindings' binary-cache layout plus Skia's headers.
# Consumers download it and point SKIA_BINARIES_URL at the file (file://...).
name: build

on:
  push:
    branches: [main]
    paths: [skia-emdawnwebgpu.patch, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  # skia-safe 0.153 binds rust-skia/skia m153-0.101.2; emsdk and Dawn of that time, so emdawnwebgpu's headers match
  # the Dawn API Graphite was written against.
  CRATE_VERSION: 0.153.3
  SKIA_TAG: m153-0.101.2
  EMSDK_VERSION: 6.0.8
  DAWN_TAG: v20260831.205016
  DAWN_SHA256: 0c23f9dc1822b8eec25b864e1a355fe5b618b2af737a02d8eb230ec52625a6dd
  # Must match the consumer's skia-safe features (plus skia-bindings' defaults).
  FEATURES: graphite,ganesh,gl

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/emdawn.zip" \
            "https://github.com/google/dawn/releases/download/$DAWN_TAG/emdawnwebgpu_pkg-$DAWN_TAG.zip"
          echo "$DAWN_SHA256  $RUNNER_TEMP/emdawn.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/emdawn.zip" -d "$RUNNER_TEMP"
          rustup target add wasm32-unknown-emscripten

      - name: Patched Skia
        run: |
          git clone --depth 1 --branch "$SKIA_TAG" https://github.com/rust-skia/skia.git "$RUNNER_TEMP/skia"
          cd "$RUNNER_TEMP/skia"
          GIT_SYNC_DEPS_SKIP_EMSDK=1 python tools/git-sync-deps
          python bin/fetch-gn
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/skia-emdawnwebgpu.patch"

      - name: Build skia-bindings
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cargo new --lib --vcs none "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          cargo add "skia-bindings@=$CRATE_VERSION" --features "$FEATURES"
          # Same Skia-side optimization as the consumer (court-editor builds skia-bindings at opt-level "s").
          printf '\n[profile.release]\nopt-level = "s"\n' >> Cargo.toml
          # Rust links with wasm exceptions, so everything in Skia that uses setjmp/longjmp (libpng, FreeType, the PNG
          # and JPEG codecs) needs wasm setjmp/longjmp too.
          port="$RUNNER_TEMP/emdawnwebgpu_pkg/emdawnwebgpu.port.py"
          export SKIA_SOURCE_DIR="$RUNNER_TEMP/skia"
          export SKIA_GN_ARGS="skia_use_dawn=true skia_use_webgpu=true extra_cflags_c=[\"-sSUPPORT_LONGJMP=wasm\"] extra_cflags_cc=[\"-sSUPPORT_LONGJMP=wasm\",\"-DSKIA_USING_EMDAWNWEBGPU\",\"--use-port=$port\"]"
          export FORCE_SKIA_BUILD=1
          cargo build --release --target wasm32-unknown-emscripten

      - name: Package
        run: |
          out=$(dirname "$(ls -t "$RUNNER_TEMP"/probe/target/wasm32-unknown-emscripten/release/build/skia-bindings-*/out/skia/bindings.rs | head -1)")
          skia="$RUNNER_TEMP/skia"
          stage="$RUNNER_TEMP/stage/skia-binaries"
          mkdir -p "$stage"
          cp "$out/libskia.a" "$out/libskia-bindings.a" "$out/bindings.rs" "$out/skia-defines.txt" "$stage"
          # Headers for consumers' own C++ against Skia (the public headers also include skcms's).
          cp -r "$skia/include" "$stage/include"
          (cd "$skia" && find modules/skcms -name '*.h' -exec cp --parents {} "$stage" \;)
          cp "$skia/LICENSE" "$stage/LICENSE_SKIA"
          tar -czf "$RUNNER_TEMP/skia-binaries.tar.gz" -C "$RUNNER_TEMP/stage" skia-binaries

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$CRATE_VERSION-$(git rev-parse --short=7 HEAD)"
          gh release create "$release" "$RUNNER_TEMP/skia-binaries.tar.gz" --target "$GITHUB_SHA" \
            --title "skia-bindings $CRATE_VERSION for wasm ($release)" \
            --notes "Skia $SKIA_TAG + skia-emdawnwebgpu.patch for wasm32-unknown-emscripten; features $FEATURES; Graphite on emdawnwebgpu $DAWN_TAG; emsdk $EMSDK_VERSION."
